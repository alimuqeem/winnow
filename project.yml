name: Winnow
options:
  bundleIdPrefix: ${WINNOW_BUNDLE_PREFIX}
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your team, from local.env via scripts/bootstrap.sh (a free Personal Team works).
    # A stable signature keeps the Photos permission across rebuilds; ad-hoc would re-prompt.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${WINNOW_TEAM}
    CODE_SIGN_IDENTITY: Apple Development

targets:
  WinnowCore:
    type: framework
    platform: macOS
    sources: [Sources/WinnowCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ${WINNOW_BUNDLE_PREFIX}.WinnowCore

  Winnow:
    type: application
    platform: macOS
    sources: [Sources/Winnow]
    dependencies:
      - target: WinnowCore
    info:
      path: Sources/Winnow/Info.plist
      properties:
        CFBundleDisplayName: Winnow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Ali Muqeem. MIT licence."
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: Winnow scans your Photos library on this Mac to find similar shots and oversized videos. Nothing leaves your device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${WINNOW_BUNDLE_PREFIX}.Winnow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # generated by scripts/make-icon.swift from docs/brand/app-icon-source.png
        # PhotoKit types aren't Sendable; Swift 5 mode keeps the app layer
        # pragmatic. WinnowCore stays in Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO

  WinnowCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/WinnowCoreTests]
    dependencies:
      - target: WinnowCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Winnow:
    build:
      targets:
        Winnow: all
        WinnowCoreTests: [test]
    test:
      targets: [WinnowCoreTests]
